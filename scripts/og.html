<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07090a;color:#eef3f4;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{position:relative;background:radial-gradient(700px 420px at 10% 0%,rgba(181,243,106,.14),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(157,140,255,.16),transparent 60%),linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/44px 44px,#07090a}

.handle{font:600 22px/1 ui-monospace,"SF Mono",Menlo,monospace;color:#b5f36a;letter-spacing:.02em;display:flex;align-items:center;gap:12px}

p{margin:30px 0 0;font-size:24px;line-height:1.4;color:#93a1a4}
.chips{position:absolute;left:64px;bottom:58px;display:flex;gap:10px;font:500 18px/1 ui-monospace,Menlo,monospace;color:#c6d0d2}

.tiles{position:absolute;right:48px;top:48px;width:540px;height:534px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}

.tile.g{display:grid;place-items:center;background:radial-gradient(closest-side,rgba(181,243,106,.22),transparent 80%),#050707}
